<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/estilos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <script src="JS/storage.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <script src="JS/materias.js" defer></script>
    <title>SGA - Materias</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html">Docentes</a>
            <a href="materias.html" class="active">Materias</a>
        </nav>
    </header>
    <main>
        <section class="form-container">
            <form id="formulario">
                <div class="form-header">
                    <h2>Registro de Materias</h2>
                </div>
                <div class="form-group">
                    <label for="nombre">Nombre de la Materia</label>
                    <input type="text" id="nombre">
                </div>
                <div class="form-group">
                    <label for="codigo">Código</label>
                    <input type="text" id="codigo">
                </div>
                <div class="form-group">
                    <label for="carrera">Carrera</label>
                    <input type="text" id="carrera">
                </div>
                 <div class="form-action">
            <button type="submit">Guardar Materia</button>
          </div>
          <div class="form-action">
            <button type="button" id="btnCancelar" class="btn-cancelar">
              Cancelar
            </button>
          </div>
            </form>
        </section>

        <section>
            <p id="mensaje"></p>
        </section>

        <section class="list-container">
            <h2>Materias Registradas</h2>
            <p id="cantidadMaterias"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Materia</th>
                        <th>Código</th>
                        <th>Carrera</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </section>
</body>

</html>
