<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/estilos.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script src="JS/storage.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <script src="JS/docentes.js" defer></script>
    <title>SGA - Docentes</title>
  </head>

  <body>
    <header>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="alumnos.html">Alumnos</a>
        <a href="docentes.html">Docentes</a>
        <a href="materias.html">Materias</a>
      </nav>
    </header>
    <main>
      <section class="form-container">
        <form id="formulario">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" /><br /><br />
          <label for="especialidad">Especialidad</label>
          <input type="text" id="especialidad" /><br /><br />
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" /><br /><br />
          <button type="submit">Guardar Docente</button>
        </form>
      </section>

      <section>
        <p id="mensaje"></p>
      </section>

      <section class="lista-container">
        <h2>Docentes Registrados</h2>
        <p id="cantidadDocentes"></p>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Especialidad</th>
              <th>e-mail</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="lista"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
